[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "windows-dlp-agent"
version = "0.1.0"
description = "A Windows Data Loss Prevention (DLP) agent"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "lildannylin" }]
dependencies = [
    "cryptography>=42.0",
    "h11>=0.14",
    "httpx[http2]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]
# Windows-only runtime extras (toast notifications). Installed on endpoints.
win = [
    "windows-toasts>=1.1; platform_system == 'Windows'",
]

[project.scripts]
windows-dlp-agent = "windows_dlp_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
